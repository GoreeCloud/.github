name: Shared GoreeCloud workflow integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify original advisory adapter and governance
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile scripts/slopmonster_advisory.py
          test -s README.md && test -s LICENSE
